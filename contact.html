<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
   (function(){
      emailjs.init("y-NVrJCFODUS6k8Jb");
   })();
    </script>
    <script src="script.js"></script>
</head>
<body class="contact-body">
    <section class="contacts">
        <h2>Contact Me</h2>

        <form action="#">
            <div class="input-box">
                <div class="input-field field">
                    <input type="text" placeholder="Full Name" id="name" class="item" autocomplete="off">
                    <div class="error-txt">Full Name can't be blank</div>
                </div>
                <div class="input-field field">
                    <input type="text" placeholder="Email" id="email" class="item" autocomplete="off">
                    <div class="error-txt">Email Address can't be blank</div>
                </div>
            </div>

            <div class="input-box">
                <div class="input-field field">
                    <input type="tel" placeholder="Phone Number" id="phone" class="item" autocomplete="off" pattern="[0-9]{1,11}" maxlength="11" title="please enter numbers only (up to 11 digits)">
                    <div class="error-txt">Phone Number can't be blank</div>
                </div>
                <div class="input-field field">
                    <input type="text" placeholder="Subject" id="subject" class="item" autocomplete="off">
                    <div class="error-txt">Subject can't be blank</div>
                </div>
            </div>

            <div class="textarea-field field">
                <textarea name="" id="message" cols="30" rows="10" placeholder="Your Message" class="item" autocomplete="off"></textarea>
                <div class="error-txt">Message can't be blank</div>
            </div>
            <div class="button-group">
             <button type="submit" id="submit-btn" onclick="sendMail(); return false;">Send Message</button>
            <a href="index.html" class="btn-home">← Back to Home</a>
            </div>
            
            
        </form>
    </section>
</body>
</html>
